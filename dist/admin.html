<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Block Devs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            overflow: hidden;
        }

        .admin-table th,
        .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-table th {
            background: rgba(255, 255, 255, 0.05);
            font-family: var(--font-heading);
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }

        .admin-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .action-btns button {
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-right: 5px;
            transition: var(--transition);
        }

        .action-btns button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .add-course-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .add-course-form input,
        .add-course-form select {
            background: transparent;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        .add-course-form input:focus {
            border-color: var(--accent-color);
        }
    </style>
  <link rel="stylesheet" crossorigin href="/assets/style-B0iJuGSZ.css">
  <link rel="stylesheet" crossorigin href="/assets/dashboard-DucFaOwo.css">
</head>

<body class="dashboard-page">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/assets/logo-DXwrT_QX.png" alt="Logo">
                <span>Admin Panel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active"><i class="icon-dashboard"></i> Overview</a>
                <a href="dashboard.html"><i class="icon-home"></i> User App</a>
                <a href="#"><i class="icon-courses"></i> Manage Courses</a>
                <a href="#"><i class="icon-users"></i> User Access</a>
                <a href="index.html"><i class="icon-logout"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="dash-header">
                <h2>Admin <span class="accent">Management</span></h2>
                <div class="header-actions">
                    <button class="btn-primary" id="add-course-toggle">New Course</button>
                </div>
            </header>

            <section id="stats-overview" style="display: flex; gap: 2rem; margin-bottom: 3rem;">
                <div class="glass" style="flex: 1; padding: 1.5rem;">
                    <span style="display: block; color: var(--text-secondary); font-size: 0.9rem;">Total Students</span>
                    <span style="font-size: 2rem; font-weight: 800; font-family: var(--font-heading);">12,405</span>
                </div>
                <div class="glass" style="flex: 1; padding: 1.5rem;">
                    <span style="display: block; color: var(--text-secondary); font-size: 0.9rem;">Course Sales</span>
                    <span style="font-size: 2rem; font-weight: 800; font-family: var(--font-heading);">$45,210</span>
                </div>
                <div class="glass" style="flex: 1; padding: 1.5rem;">
                    <span style="display: block; color: var(--text-secondary); font-size: 0.9rem;">Completion
                        Rate</span>
                    <span style="font-size: 2rem; font-weight: 800; font-family: var(--font-heading);">84%</span>
                </div>
            </section>

            <section id="manage-courses">
                <h3>Current Courses</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Students</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-course-list">
                        <!-- Populated by JS -->
                    </tbody>
                </table>

                <div id="add-course-container" style="display: none; margin-top: 3rem;">
                    <h3>Add New Course</h3>
                    <form class="add-course-form" id="course-form">
                        <input type="text" placeholder="Course Title" id="f_title" required>
                        <input type="text" placeholder="Subtitle (e.g. Solidity track)" id="f_subtitle" required>
                        <select id="f_category">
                            <option value="Ethereum">Ethereum</option>
                            <option value="Solana" selected>Solana</option>
                            <option value="Blockchain">Foundations</option>
                        </select>
                        <input type="number" placeholder="Initial Students" id="f_students" value="0">
                        <button type="submit" class="btn-primary" style="grid-column: span 2;">Create Course</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const courseList = document.getElementById('admin-course-list');
            const formContainer = document.getElementById('add-course-container');
            const toggleBtn = document.getElementById('add-course-toggle');
            const form = document.getElementById('course-form');

            // Toggle form
            toggleBtn.addEventListener('click', () => {
                formContainer.style.display = formContainer.style.display === 'none' ? 'block' : 'none';
            });

            // Initialize data if needed
            function initAdminData() {
                if (!localStorage.getItem('bd_courses')) {
                    const initialCourses = [
                        { id: 1, title: 'Ethereum Programming', subtitle: 'The Solidity Mastery Course', progress: 65, tag: 'Ethereum', students: '12,500' },
                        { id: 2, title: 'Solana Development', subtitle: 'Rust & Anchor Framework', progress: 20, tag: 'Solana', students: '8,200' },
                        { id: 3, title: 'Web3 Integration', subtitle: 'Metamask & Ethers.js', progress: 0, tag: 'Web3', students: '3,100' }
                    ];
                    localStorage.setItem('bd_courses', JSON.stringify(initialCourses));
                }
            }
            initAdminData();

            // Load courses from LocalStorage
            function loadCourses() {
                const courses = JSON.parse(localStorage.getItem('bd_courses')) || [];
                courseList.innerHTML = courses.map(c => `
                    <tr>
                        <td>${c.id}</td>
                        <td style="font-weight: 600;">${c.title}</td>
                        <td><span class="tag pill">${c.tag}</span></td>
                        <td>${c.students || '1,200'}</td>
                        <td><span style="color: #4CAF50;">Live</span></td>
                        <td class="action-btns">
                            <button onclick="deleteCourse(${c.id})">Delete</button>
                            <button>Edit</button>
                        </td>
                    </tr>
                `).join('');
            }

            // Handle Course Creation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const courses = JSON.parse(localStorage.getItem('bd_courses')) || [];
                const newCourse = {
                    id: courses.length + 1,
                    title: document.getElementById('f_title').value,
                    subtitle: document.getElementById('f_subtitle').value,
                    tag: document.getElementById('f_category').value,
                    students: document.getElementById('f_students').value,
                    progress: 0
                };
                courses.push(newCourse);
                localStorage.setItem('bd_courses', JSON.stringify(courses));
                form.reset();
                formContainer.style.display = 'none';
                loadCourses();
                alert('Course Created Successfully!');
            });

            // Delete Course
            window.deleteCourse = (id) => {
                if (confirm('Are you sure you want to delete this course?')) {
                    const courses = JSON.parse(localStorage.getItem('bd_courses')) || [];
                    const filtered = courses.filter(c => c.id !== id);
                    localStorage.setItem('bd_courses', JSON.stringify(filtered));
                    loadCourses();
                }
            };

            loadCourses();
        });
    </script>
</body>

</html>
